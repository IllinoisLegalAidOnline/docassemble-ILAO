translations:
  - ILAO_es.xlsx
---
initial: True
code: |
  al_interview_languages = ["en","es"]
---
metadata:
  title url: 
    "en*": https://www.illinoislegalaid.org 
    "es": https://es.illinoislegalaid.org 
  title: 
    "en*": Easy Forms
    "es": Formularios Fáciles
  short title:
    "en*": Easy Forms
    "es": Formularios Fáciles
---
modules:
  - .toolbox
---
include:
  - docassemble.AssemblyLine:assembly_line.yml
---
terms: 
  - "Easy Forms": |
      Easy Forms make it easy to create legal forms and letters. They guide you through a simple interview. You answer questions, and the program does the work.
---
features:
  css: ilao_theme_2.css
  question back button: False
---
default screen parts:
  title url: |
    ${ localized_metadata_text(all_variables(special='metadata'), 'title url') }
  title: |
    ${ localized_metadata_text(all_variables(special='metadata'), 'title') }
  logo: |
    <div id='nav-title-container' class='title-container'>
      <div class="al-logo">
        <img src="/packagestatic/docassemble.ILAO/logo_white_30.svg" alt="Illinois Legal Aid Online">
      </div>
      <div class="al-title">
        <div class="title-row-1">${ localized_metadata_text(all_variables(special='metadata'), 'title') }</div>
        <div class="title-row-2">${ "Home" }</div>
      </div>
    </div> 
  short logo: |
    <div id='nav-title-container' class='title-container'>
      <div class="al-logo">
        <img src="/packagestatic/docassemble.ILAO/logo_white_30.svg" alt="Illinois Legal Aid Online">
      </div>
      <div class="al-title">
        <div class="title-row-1">${ localized_metadata_text(all_variables(special='metadata'), 'short title') }</div>
        <div class="title-row-2">${ "Home" }</div>
      </div>
    </div>
  navigation bar html: |
    % if enable_al_language and len(al_interview_languages) > 1:
    ${ get_language_list_dropdown(al_interview_languages, current=session_local.attr("al_user_language") or al_user_language, icon="fas fa-globe fa-xl") }
    % endif
  under: |
    Questions or comments? [**Contact ILAO**](https://www.illinoislegalaid.org/contact-us).
  footer: off
---
mandatory: True
id: home
question: |
  **ILAO Easy Forms**
subquestion: |
  Thank you for your interest in Illinois Legal Aid Online **{Easy Forms}**.
  
  <a target="_self" href="https://easyforms.illinoislegalaid.org/user/sign-in?next=https://easyforms.illinoislegalaid.org/interviews">Sign in</a> to your ILAO Easy Forms account to access your saved Easy Forms.
  
  Looking for other forms? Check out the [**ILAO Form Library**](https://www.illinoislegalaid.org/form-library).
---